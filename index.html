<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>駐車場 共有マップ</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --border: #ddd9d0;
    --text: #2c2c2a;
    --text-muted: #8a8880;
    --accent: #d85a30;
    --accent-bg: #faece7;
    --empty-bg: #eeecea;
    --danger: #a32d2d;
    --danger-border: #f09595;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
  }

  /* ===== ログイン画面 ===== */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 80vh; gap: 16px;
  }
  #login-screen h1 { font-size: 20px; font-weight: 700; margin: 0; }
  #login-screen p { font-size: 13px; color: var(--text-muted); margin: 0; }
  .login-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px 20px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
  }
  .login-box input[type="password"] {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 18px; font-family: inherit; background: var(--bg); color: var(--text);
    text-align: center; letter-spacing: 4px;
  }
  .login-box input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .login-error { font-size: 13px; color: var(--danger); text-align: center; display: none; }

  /* ===== メイン画面 ===== */
  #main-screen { display: none; }
  .header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .sub { font-size: 12px; color: var(--text-muted); margin: 3px 0 0; }

  .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .tab {
    font-size:13px; font-weight:500; padding:8px 14px;
    border:none; background:none; cursor:pointer; color:var(--text-muted);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .page { display:none; }
  .page.active { display:block; }

  /* 駐車場グリッド：全列を横に並べる */
  .lot-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .lot-grid {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 4px;
    /* 6列×42px + 通路2本×14px + gap7本×4px = 252+28+28 = 308px → スマホに収まる */
  }
  .slot-col { display:flex; flex-direction:column; gap:3px; }
  .col-label { font-size:11px; font-weight:700; color:var(--text-muted); text-align:center; padding:0 0 3px; }
  .slot {
    width: 42px;
    height: 52px;
    border-radius: 6px;
    padding: 3px 2px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--empty-bg);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    transition: transform 0.1s;
    overflow: hidden;
  }
  .slot:active { transform:scale(0.93); }
  .slot.occupied { background:var(--accent-bg); border-color:#f0997b; }
  .slot-name { font-size:9px; font-weight:600; margin:0 0 1px; line-height:1.2; width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .slot-num  { font-size:11px; font-weight:700; margin:0; color:var(--accent); letter-spacing:0.5px; }
  .slot-empty { font-size:9px; color:var(--text-muted); margin:0; }
  /* 通路 */
  .road-col { display:flex; flex-direction:column; align-items:center; padding-top:18px; }
  .road-inner {
    width: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: repeating-linear-gradient(180deg,var(--border) 0px,var(--border) 5px,transparent 5px,transparent 10px);
    border-radius: 3px; position: relative;
  }
  .road-label-v {
    font-size: 9px; font-weight: 700; color: var(--text-muted);
    writing-mode: vertical-rl; letter-spacing: 2px;
    background: var(--bg); padding: 4px 1px; border-radius: 3px;
    position: absolute;
  }

  /* 駐車状況 */
  .section-title { font-weight:600; font-size:14px; margin:0 0 8px; }
  .status-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:7px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; background:var(--card); margin-bottom:5px;
  }
  .status-row .plate { color:var(--text-muted); font-size:11px; }
  .empty-msg { font-size:13px; color:var(--text-muted); }

  /* 車両管理 */
  .veh-manage-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    background:var(--card); margin-bottom:6px;
  }
  .veh-manage-name { font-size:13px; font-weight:500; margin:0 0 2px; }
  .veh-manage-plate { font-size:11px; color:var(--text-muted); }
  .del-btn { border:1px solid var(--danger-border); color:var(--danger); background:none; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .add-form { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:16px; }
  .add-form p { font-size:13px; font-weight:600; margin:0 0 10px; }
  .field { margin-bottom:8px; }
  .field label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px; }
  .field input {
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--bg); color:var(--text);
  }
  .field input:focus { outline:none; border-color:var(--accent); }

  button {
    font-family:inherit; font-size:13px; padding:8px 14px;
    border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); cursor:pointer;
  }
  button:active { transform:scale(0.97); }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; width:100%; padding:12px; font-size:15px; }

  /* モーダル */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:flex-end; justify-content:center; z-index:10; }
  .modal-overlay.open { display:flex; }
  .modal-card { background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:18px; max-height:80vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .modal-head h2 { font-size:16px; margin:0; font-weight:600; }
  .close-btn { border:none; background:none; font-size:22px; padding:2px 6px; color:var(--text-muted); }
  .veh-btn { width:100%; text-align:left; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; }
  .veh-note { display:block; font-size:11px; color:var(--text-muted); margin-top:2px; }
  .clear-btn { width:100%; color:var(--danger); border-color:var(--danger-border); margin-top:6px; }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <h1>🅿️ 駐車場 共有マップ</h1>
  <p>パスワードを入力してください</p>
  <div class="login-box">
    <input type="password" id="pw-input" placeholder="••••••" autocomplete="current-password">
    <p class="login-error" id="login-error">パスワードが違います</p>
    <button class="btn-primary" id="login-btn">ログイン</button>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <div class="header-row">
    <div>
      <h1>🅿️ 駐車場 共有マップ</h1>
      <p class="sub" id="summary">読み込み中...</p>
    </div>
    <button id="reset-btn">全解除</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="map">マップ</button>
    <button class="tab" data-tab="status">駐車状況</button>
    <button class="tab" data-tab="vehicles">車両管理</button>
  </div>

  <div class="page active" id="page-map">
    <div class="lot-scroll"><div class="lot-grid" id="lot-grid"></div></div>
  </div>

  <div class="page" id="page-status">
    <div id="status-list"></div>
  </div>

  <div class="page" id="page-vehicles">
    <div class="add-form">
      <p>車両を追加</p>
      <div class="field">
        <label>名前（氏名・車種など）</label>
        <input type="text" id="input-name" placeholder="例: 田中 太郎">
      </div>
      <div class="field">
        <label>ナンバープレート</label>
        <input type="text" id="input-plate" placeholder="例: 品川 300 あ 12-34">
      </div>
      <button class="btn-primary" id="add-vehicle-btn">追加する</button>
    </div>

    <div class="add-form">
      <p>Excelから一括取込</p>
      <p style="font-size:12px;color:var(--text-muted);margin:-4px 0 10px;">D列：車名　F列：ナンバー のExcelファイルを選択</p>
      <input type="file" id="excel-input" accept=".xlsx,.xls" style="display:none">
      <button id="excel-select-btn" style="width:100%;margin-bottom:8px;">📂 Excelファイルを選択</button>
      <div id="excel-preview" style="display:none;">
        <p style="font-size:12px;color:var(--text-muted);margin:0 0 6px;" id="excel-preview-label"></p>
        <div id="excel-preview-list" style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--bg);font-size:12px;margin-bottom:8px;"></div>
        <button class="btn-primary" id="excel-import-btn">この内容で一括登録する</button>
      </div>
    </div>

    <p class="section-title">登録済み車両</p>
    <div id="vehicle-manage-list"></div>
  </div>
</div>

<!-- モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modal-title">車両を選択</h2>
      <button class="close-btn" id="modal-close">×</button>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;" id="modal-current"></p>
    <div id="vehicle-list"></div>
    <button class="clear-btn" id="clear-slot-btn">この枠を空にする</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  let state = { slots: [], layout: [], vehicles: [], assignments: {} };
  let activeSlot = null;

  // ===== ログイン =====
  async function tryLogin() {
    const pw = document.getElementById('pw-input').value;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      fetchState();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  document.getElementById('login-btn').addEventListener('click', tryLogin);
  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });

  // 既にセッションがあればそのままメイン画面へ
  async function checkSession() {
    const res = await fetch('/api/state');
    if (res.ok) {
      state = await res.json();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      render();
    }
  }
  checkSession();

  // ===== API =====
  async function fetchState() {
    try {
      const res = await fetch('/api/state');
      if (res.status === 401) return; // 未ログイン
      state = await res.json();
      render();
    } catch(e) {}
  }

  async function apiPost(path, payload) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.status === 401) return;
    state = await res.json();
    render();
  }

  // ===== タブ =====
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('page-' + tab.dataset.tab).classList.add('active');
    });
  });

  function vehicleById(id) { return state.vehicles.find(v => v.id === id); }

  function render() {
    renderGrid();
    renderSummary();
    renderStatusList();
    renderVehicleManage();
  }

  function renderGrid() {
    const grid = document.getElementById('lot-grid');
    grid.innerHTML = '';
    const layout = state.layout && state.layout.length ? state.layout : [];

    // layoutをセクション（連続するcol群）と通路に分割
    const segments = [];
    let currentCols = [];
    layout.forEach(item => {
      if (item.type === 'col') {
        currentCols.push(item);
      } else if (item.type === 'road') {
        if (currentCols.length) { segments.push({ type: 'cols', cols: currentCols }); currentCols = []; }
        segments.push({ type: 'road', label: item.label || '通路' });
      }
    });
    if (currentCols.length) segments.push({ type: 'cols', cols: currentCols });

    segments.forEach(seg => {
      if (seg.type === 'road') {
        // 通路区切り（横方向）
        const divider = document.createElement('div');
        divider.style.cssText = 'display:flex;align-items:center;gap:8px;margin:10px 0;';
        divider.innerHTML = `
          <div style="flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--border) 0,var(--border) 8px,transparent 8px,transparent 14px);border-radius:2px;"></div>
          <span style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:2px;">${seg.label}</span>
          <div style="flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--border) 0,var(--border) 8px,transparent 8px,transparent 14px);border-radius:2px;"></div>
        `;
        grid.appendChild(divider);

      } else if (seg.type === 'cols') {
        // 列グループ：横に並べる、行を縦に積む
        const maxRows = Math.max(...seg.cols.map(c => c.rows));

        // 列ヘッダー行
        const headerRow = document.createElement('div');
        headerRow.style.cssText = 'display:flex;gap:6px;margin-bottom:4px;';
        seg.cols.forEach(colItem => {
          const h = document.createElement('div');
          h.style.cssText = 'flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);';
          h.textContent = colItem.col + '列';
          headerRow.appendChild(h);
        });
        grid.appendChild(headerRow);

        // 各行
        for (let row = 1; row <= maxRows; row++) {
          const rowEl = document.createElement('div');
          rowEl.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;';

          seg.cols.forEach(colItem => {
            if (row > colItem.rows) {
              // この列にはこの行がない → 透明の空白
              const blank = document.createElement('div');
              blank.style.cssText = 'flex:1;';
              rowEl.appendChild(blank);
              return;
            }
            const slotId = colItem.col + row;
            const vehicleId = state.assignments[slotId];
            const v = vehicleId ? vehicleById(vehicleId) : null;
            const cell = document.createElement('div');
            cell.className = 'slot' + (v ? ' occupied' : '');
            cell.style.flex = '1';
            cell.style.width = 'auto';
            if (v) {
              const digits = (v.plate || '').replace(/-/g, '').match(/\d{4}$/);
              const num4 = digits ? digits[0] : v.plate;
              const nameEl = document.createElement('p');
              nameEl.className = 'slot-name';
              nameEl.textContent = v.name;
              cell.appendChild(nameEl);
              const numEl = document.createElement('p');
              numEl.className = 'slot-num';
              numEl.textContent = num4;
              cell.appendChild(numEl);
            } else {
              const emptyEl = document.createElement('p');
              emptyEl.className = 'slot-empty';
              emptyEl.textContent = '空き';
              cell.appendChild(emptyEl);
            }
            cell.addEventListener('click', () => openModal(slotId));
            rowEl.appendChild(cell);
          });
          grid.appendChild(rowEl);
        }
      }
    });
  }

  function renderSummary() {
    const occupied = Object.keys(state.assignments).length;
    document.getElementById('summary').textContent = `${occupied} / ${state.slots.length} 台が駐車中`;
  }

  function renderStatusList() {
    const list = document.getElementById('status-list');
    list.innerHTML = '';
    let any = false;
    state.slots.forEach(slot => {
      const id = state.assignments[slot];
      if (!id) return;
      any = true;
      const v = vehicleById(id);
      const row = document.createElement('div');
      row.className = 'status-row';
      row.innerHTML = `<span><strong>${slot}</strong> — ${v ? v.name : id}</span><span class="plate">${v ? v.plate : ''}</span>`;
      list.appendChild(row);
    });
    if (!any) list.innerHTML = '<p class="empty-msg">現在駐車中の車両はありません。</p>';
  }

  function renderVehicleManage() {
    const list = document.getElementById('vehicle-manage-list');
    list.innerHTML = '';
    if (state.vehicles.length === 0) {
      list.innerHTML = '<p class="empty-msg">まだ車両が登録されていません。</p>';
      return;
    }
    state.vehicles.forEach(v => {
      const item = document.createElement('div');
      item.className = 'veh-manage-item';
      item.innerHTML = `<div><p class="veh-manage-name">${v.name}</p><p class="veh-manage-plate">${v.plate}</p></div><button class="del-btn" data-id="${v.id}">削除</button>`;
      item.querySelector('.del-btn').addEventListener('click', () => {
        if (confirm(`「${v.name}」を削除しますか？`)) apiPost('/api/vehicle/delete', { vehicle_id: v.id });
      });
      list.appendChild(item);
    });
  }

  // ===== Excel一括取込 =====
  let excelVehicles = [];

  document.getElementById('excel-select-btn').addEventListener('click', () => {
    document.getElementById('excel-input').click();
  });

  document.getElementById('excel-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const wb = XLSX.read(evt.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

        excelVehicles = [];
        rows.forEach((row, i) => {
          const name  = row[3] ? String(row[3]).trim() : ''; // D列
          const plate = row[5] ? String(row[5]).trim() : ''; // F列
          if (!name) return;
          excelVehicles.push({ name, plate });
        });

        if (excelVehicles.length === 0) {
          alert('D列に車名が見つかりませんでした。');
          return;
        }

        // プレビュー表示
        const previewList = document.getElementById('excel-preview-list');
        previewList.innerHTML = excelVehicles.map(v =>
          `<div style="padding:3px 0;border-bottom:1px solid var(--border);">${v.name}　<span style="color:var(--text-muted)">${v.plate}</span></div>`
        ).join('');
        document.getElementById('excel-preview-label').textContent = `${excelVehicles.length}件を読み込みました。確認して登録してください。`;
        document.getElementById('excel-preview').style.display = 'block';
      } catch(err) {
        alert('Excelの読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsBinaryString(file);
    e.target.value = ''; // 同じファイルを再選択できるようにリセット
  });

  document.getElementById('excel-import-btn').addEventListener('click', async () => {
    if (excelVehicles.length === 0) return;
    await apiPost('/api/vehicle/bulk_add', { vehicles: excelVehicles });
    excelVehicles = [];
    document.getElementById('excel-preview').style.display = 'none';
    document.getElementById('excel-preview-list').innerHTML = '';
    alert(`${excelVehicles.length}件を登録しました。`);
  });

  document.getElementById('add-vehicle-btn').addEventListener('click', async () => {
    const name  = document.getElementById('input-name').value.trim();
    const plate = document.getElementById('input-plate').value.trim();
    if (!name) { alert('名前を入力してください'); return; }
    await apiPost('/api/vehicle/add', { name, plate });
    document.getElementById('input-name').value = '';
    document.getElementById('input-plate').value = '';
  });

  function openModal(slot) {
    activeSlot = slot;
    document.getElementById('modal-title').textContent = slot + ' の車両を選択';
    const currentId = state.assignments[slot];
    const currentV = currentId ? vehicleById(currentId) : null;
    document.getElementById('modal-current').textContent = currentV ? '現在: ' + currentV.name : '現在: 空き';
    const listEl = document.getElementById('vehicle-list');
    listEl.innerHTML = '';
    if (state.vehicles.length === 0) {
      listEl.innerHTML = '<p style="font-size:13px;color:var(--text-muted);">「車両管理」タブから車両を登録してください。</p>';
    } else {
      state.vehicles.forEach(v => {
        const usedSlot = Object.keys(state.assignments).find(s => state.assignments[s] === v.id);
        const note = (usedSlot && usedSlot !== slot) ? '現在 ' + usedSlot + ' に駐車中' : v.plate;
        const btn = document.createElement('button');
        btn.className = 'veh-btn';
        btn.innerHTML = `<span>${v.name}<span class="veh-note">${note}</span></span>${currentId === v.id ? '✓' : ''}`;
        btn.addEventListener('click', () => { apiPost('/api/assign', { slot, vehicle_id: v.id }); closeModal(); });
        listEl.appendChild(btn);
      });
    }
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    activeSlot = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
  document.getElementById('clear-slot-btn').addEventListener('click', () => { if (activeSlot) apiPost('/api/assign', { slot: activeSlot, vehicle_id: null }); closeModal(); });
  document.getElementById('reset-btn').addEventListener('click', () => { if (confirm('すべての枠を空にしますか？')) apiPost('/api/reset', {}); });

  setInterval(() => {
    if (!document.getElementById('modal-overlay').classList.contains('open')) fetchState();
  }, 3000);
</script>
</body>
</html>
